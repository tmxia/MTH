name: Build HarmonyOS HAP
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2
        with:
          sdk-version: '4.1.0'
      - name: Install dependencies
        run: ohpm install --all
      - name: Build HAP
        run: hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Release-HAP
          path: entry/build/default/outputs/default/*.hap
