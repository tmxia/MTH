name: Build & Release HAP
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2

      # 1. 还原证书文件
      - name: Restore Signing Files
        run: |
          echo "${{ secrets.HAP_P12_BASE64 }}" | base64 -d > signature.p12
          echo "${{ secrets.HAP_P7B_BASE64 }}" | base64 -d > signature.p7b
          keytool -exportcert -alias "${{ secrets.HAP_KEY_ALIAS }}" -keystore signature.p12 -storepass "${{ secrets.HAP_KEY_PASSWORD }}" -rfc -file signature.cer

      # 2. 清空 build-profile.json5 的签名配置，强行让 hvigor 不执行自动签名
      - name: Disable hvigor auto-sign
        run: |
          python3 -c "
          import json
          with open('build-profile.json5', 'r') as f: data = json.load(f)
          data['app']['signingConfigs'] = []
          with open('build-profile.json5', 'w') as f: json.dump(data, f, indent=2)
          "

      # 3. 编译生成未签名包 (此时会生成 entry-default-unsigned.hap)
      - name: Build HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon

      # 4. 使用官方签名工具手动签名
      - name: Sign HAP manually
        run: |
          # 查找签名工具位置
          SIGN_TOOL=$(find $HOS_SDK_HOME -name "hap-sign-tool.jar" | head -n 1)
          echo "Found sign tool: $SIGN_TOOL"
          
          # 找到未签名的 hap 文件
          UNSIGNED_HAP=$(find entry/build/default/outputs/default -name "*.hap" | grep -v "signed" | head -n 1)
          if [ -z "$UNSIGNED_HAP" ]; then
            UNSIGNED_HAP=$(find entry/build/default/outputs/default -name "*.hap" | head -n 1)
          fi
          echo "Unsigned HAP: $UNSIGNED_HAP"
          
          # 执行官方签名
          java -jar "$SIGN_TOOL" sign-app             -keyAlias "${{ secrets.HAP_KEY_ALIAS }}"             -signAlg "SHA256withECDSA"             -mode "localSign"             -appCertFile "signature.cer"             -profileFile "signature.p7b"             -inFile "$UNSIGNED_HAP"             -keystoreFile "signature.p12"             -outFile "entry/build/default/outputs/default/entry-default-signed.hap"             -keyPwd "${{ secrets.HAP_KEY_PASSWORD }}"             -keystorePwd "${{ secrets.HAP_KEY_PASSWORD }}"

      # 5. 自动发布到 Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MTH Release v1.0.${{ github.run_number }}
          body: "Auto-built and signed by GitHub Actions."
          files: entry/build/default/outputs/default/entry-default-signed.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. 保留 Actions 产物
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Signed-HAP
          path: entry/build/default/outputs/default/entry-default-signed.hap
