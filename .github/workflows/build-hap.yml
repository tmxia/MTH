name: Build & Release HAP
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2

      - name: Restore Signing Files
        run: |
          # 防止某些校验报找不到 material 目录
          mkdir -p material
          
          echo "${{ secrets.HAP_P12_BASE64 }}" | base64 -d > signature.p12
          echo "${{ secrets.HAP_P7B_BASE64 }}" | base64 -d > signature.p7b
          
          # 关键修复：加上 -rfc 参数，导出 PEM 文本格式的证书，解决 Invalid certpath 问题
          keytool -exportcert -alias "${{ secrets.HAP_KEY_ALIAS }}" -keystore signature.p12 -storepass "${{ secrets.HAP_KEY_PASSWORD }}" -rfc -file signature.cer
          
          # 打印一下文件信息确认
          ls -la signature.*

      - name: Configure Signing in build-profile.json5
        run: |
          python3 -c "
          import json
          with open('build-profile.json5', 'r') as f: data = json.load(f)
          data['app']['signingConfigs'] = [{
              'name': 'default',
              'type': 'HarmonyOS',
              'material': {
                  'certpath': './signature.cer',
                  'storePassword': '${{ secrets.HAP_KEY_PASSWORD }}',
                  'keyAlias': '${{ secrets.HAP_KEY_ALIAS }}',
                  'keyPassword': '${{ secrets.HAP_KEY_PASSWORD }}',
                  'profile': './signature.p7b',
                  'signAlg': 'SHA256withECDSA',
                  'storeFile': './signature.p12'
              }
          }]
          with open('build-profile.json5', 'w') as f: json.dump(data, f, indent=2)
          "

      - name: Build HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MTH Release v1.0.${{ github.run_number }}
          body: "Auto-built and signed by GitHub Actions."
          files: entry/build/default/outputs/default/*.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Signed-HAP
          path: entry/build/default/outputs/default/*.hap
