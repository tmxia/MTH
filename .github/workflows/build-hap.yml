name: Build & Release HAP
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2

      # 清空签名配置，强制生成未签名包
      - name: Remove Signing Configs
        run: |
          python3 -c "
          import json
          with open('build-profile.json5', 'r') as f: data = json.load(f)
          data['app']['signingConfigs'] = []
          with open('build-profile.json5', 'w') as f: json.dump(data, f, indent=2)
          "

      # 编译打包
      - name: Build HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon

      # 自动发布未签名的包到 Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-unsigned
          name: MTH Release v1.0.${{ github.run_number }} (Unsigned)
          body: "Auto-built by GitHub Actions. (Unsigned HAP, cannot be installed on real devices directly)"
          files: entry/build/default/outputs/default/*.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 保留 Actions 产物
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Unsigned-HAP
          path: entry/build/default/outputs/default/*.hap
