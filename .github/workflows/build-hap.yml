name: Build HarmonyOS HAP
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2
        # 这里不再指定 version，使用它默认的稳定版本（上次默认是 API 26）
      - name: Build HAP
        run: |
          # 直接调用全局工具链构建，无需 ohpm install
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Release-HAP
          path: entry/build/default/outputs/default/*.hap
