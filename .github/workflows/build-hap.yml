name: Build & Release HAP
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2

      # 1. 依然保留 material 目录并生成签名文件
      - name: Restore Signing Files
        run: |
          mkdir -p material
          echo "${{ secrets.HAP_P12_BASE64 }}" | base64 -d > material/signature.p12
          echo "${{ secrets.HAP_P7B_BASE64 }}" | base64 -d > material/signature.p7b
          keytool -exportcert -alias "${{ secrets.HAP_KEY_ALIAS }}" -keystore material/signature.p12 -storepass "${{ secrets.HAP_KEY_PASSWORD }}" -rfc -file material/signature.cer
          ls -la material/

      # 2. 核心修复：使用绝对路径注入 build-profile.json5
      - name: Configure Signing with Absolute Path
        run: |
          python3 -c "
          import json, os
          
          # 获取当前绝对路径
          base_dir = os.getcwd()
          p12_abs = os.path.join(base_dir, 'material', 'signature.p12')
          p7b_abs = os.path.join(base_dir, 'material', 'signature.p7b')
          cer_abs = os.path.join(base_dir, 'material', 'signature.cer')
          
          with open('build-profile.json5', 'r') as f: data = json.load(f)
          data['app']['signingConfigs'] = [{
              'name': 'default',
              'type': 'HarmonyOS',
              'material': {
                  'certpath': cer_abs,
                  'storePassword': '${{ secrets.HAP_KEY_PASSWORD }}',
                  'keyAlias': '${{ secrets.HAP_KEY_ALIAS }}',
                  'keyPassword': '${{ secrets.HAP_KEY_PASSWORD }}',
                  'profile': p7b_abs,
                  'signAlg': 'SHA256withECDSA',
                  'storeFile': p12_abs
              }
          }]
          with open('build-profile.json5', 'w') as f: json.dump(data, f, indent=2)
          print('Injected absolute paths successfully:')
          print(json.dumps(data['app']['signingConfigs'][0]['material'], indent=2))
          "

      # 3. 编译打包
      - name: Build HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon

      # 4. 自动发布到 Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MTH Release v1.0.${{ github.run_number }}
          body: "Auto-built and signed by GitHub Actions."
          files: entry/build/default/outputs/default/*.hap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. 保留 Actions 产物
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Signed-HAP
          path: entry/build/default/outputs/default/*.hap
