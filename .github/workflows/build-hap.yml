name: Build & Release HAP
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2

      - name: Remove Signing Configs
        run: |
          python3 - <<'PY'
          import json
          with open('build-profile.json5', 'r') as f:
              data = json.load(f)
          data['app']['signingConfigs'] = []
          with open('build-profile.json5', 'w') as f:
              json.dump(data, f, indent=2)
          PY

      - name: Prepare signing materials
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          CERT_B64:     ${{ secrets.CERT_BASE64 }}
          PROFILE_B64:  ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ] || [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "❌ 缺少签名 Secrets"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          echo "$CERT_B64"     | base64 -d > "$RUNNER_TEMP/signing.cer"
          echo "$PROFILE_B64"  | base64 -d > "$RUNNER_TEMP/signing.p7b"
          chmod 600 "$RUNNER_TEMP/signing.p12"
          echo "✅ 签名材料已就绪"

      - name: Build HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default --no-parallel --no-daemon

      - name: Sign HAP
        env:
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "❌ 缺少 KEY_ALIAS / KEYSTORE_PASSWORD"
            exit 1
          fi

          SIGN_JAR=$(find "$HOS_SDK_HOME" -name "hap-sign-tool.jar" | head -1)
          if [ -z "$SIGN_JAR" ]; then
            SIGN_JAR=$(find / -name "hap-sign-tool.jar" 2>/dev/null | head -1)
          fi
          
          UNSIGNED_LIST=$(find entry/build -name "*-unsigned.hap" -type f)
          if [ -z "$UNSIGNED_LIST" ]; then
            echo "❌ 未找到 *-unsigned.hap"
            exit 1
          fi

          SIGNED_FILES=()
          while IFS= read -r UNSIGNED; do
            [ -z "$UNSIGNED" ] && continue
            DIR=$(dirname "$UNSIGNED")
            BASE=$(basename "$UNSIGNED" | sed 's/-unsigned\.hap$/.hap/')
            SIGNED="$DIR/$BASE"
            
            java -jar "$SIGN_JAR" sign-app \
              -keyAlias "$KEY_ALIAS" \
              -signAlg "SHA256withECDSA" \
              -mode "localSign" \
              -appCertFile "$RUNNER_TEMP/signing.cer" \
              -profileFile "$RUNNER_TEMP/signing.p7b" \
              -inFile "$UNSIGNED" \
              -keystoreFile "$RUNNER_TEMP/signing.p12" \
              -outFile "$SIGNED" \
              -keyPwd "$KEYSTORE_PASSWORD" \
              -keystorePwd "$KEYSTORE_PASSWORD" \
              -signCode "1"
              
            SIGNED_FILES+=("$SIGNED")
            ls -lh "$SIGNED"
          cp "$SIGNED" "$DIR/MTH-release.hap"
          done <<< "$UNSIGNED_LIST"

          echo "SIGNED_HAP=${SIGNED_FILES[0]}" >> "$GITHUB_ENV"
          echo "✅ 签名完成：${#SIGNED_FILES[@]} 个"

      - name: Sign Debug HAP
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_CERT_B64:     ${{ secrets.DEBUG_CERT_BASE64 }}
          DEBUG_PROFILE_B64:  ${{ secrets.DEBUG_PROFILE_BASE64 }}
          DEBUG_KEY_ALIAS:    ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEYSTORE_PWD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "⏭️  未配置调试证书 Secrets（git-ps key hap-debug 上传），跳过"
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.p12"
          echo "$DEBUG_CERT_B64"     | base64 -d > "$RUNNER_TEMP/debug.cer"
          echo "$DEBUG_PROFILE_B64"  | base64 -d > "$RUNNER_TEMP/debug.p7b"
          chmod 600 "$RUNNER_TEMP/debug.p12"
          SIGN_JAR=$(find "$HOS_SDK_HOME" -name "hap-sign-tool.jar" 2>/dev/null | head -1)
          [ -z "$SIGN_JAR" ] && SIGN_JAR=$(find / -name "hap-sign-tool.jar" 2>/dev/null | head -1)
          UNSIGNED=$(find entry/build -name "*-unsigned.hap" -type f | head -1)
          [ -z "$UNSIGNED" ] && { echo "❌ 未找到 unsigned.hap"; exit 1; }
          DIR=$(dirname "$UNSIGNED")
          SIGNED="$DIR/entry-default-debug.hap"
          echo "📦 调试签名: $UNSIGNED → $SIGNED"
          java -jar "$SIGN_JAR" sign-app \
            -keyAlias "$DEBUG_KEY_ALIAS" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "$RUNNER_TEMP/debug.cer" \
            -profileFile "$RUNNER_TEMP/debug.p7b" \
            -inFile "$UNSIGNED" \
            -keystoreFile "$RUNNER_TEMP/debug.p12" \
            -outFile "$SIGNED" \
            -keyPwd "$DEBUG_KEYSTORE_PWD" \
            -keystorePwd "$DEBUG_KEYSTORE_PWD" \
            -signCode "1"
          ls -lh "$SIGNED"
          cp "$SIGNED" "$DIR/MTH-debug.hap"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP"/signing.p12 "$RUNNER_TEMP"/signing.cer "$RUNNER_TEMP"/signing.p7b
          rm -f entry/build/default/outputs/default/*-unsigned.hap "$RUNNER_TEMP"/debug.p12 "$RUNNER_TEMP"/debug.cer "$RUNNER_TEMP"/debug.p7b

      - name: Read app version
        id: appver
        run: |
          VER=$(grep -E '"versionName"' AppScope/app.json5 | sed -E 's/.*"versionName"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "📦 app 版本: $VER"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}-signed
          name: v${{ steps.appver.outputs.version }}
          files: entry/build/default/outputs/default/MTH-*.hap
          allowUpdates: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTH-Signed-HAP
          path: entry/build/default/outputs/default/MTH-*.hap
